<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Clientes</h1>
        <p>Crear, revisar y eliminar clientes.</p>
    </header>

    <nav>
        <a href="admin.html">Inicio</a>
        <a href="admin-canchas.html">Todas las canchas</a>
        <a href="admin-reservas.html">Todas las reservas</a>
        <a href="admin-usuarios.html">Usuarios / Dueños</a>
        <a href="admin-clientes.html">Clientes</a>
        <button id="btnSalir">Cerrar sesión</button>
    </nav>

    <main>
        <section>
            <h2>Crear cliente</h2>
            <p>El nuevo cliente podrá iniciar sesión, buscar canchas y realizar reservas.</p>

            <form id="formNuevoCliente" novalidate>
                <div class="campo">
                    <label for="nombreNuevoCliente">Nombre</label>
                    <input type="text" id="nombreNuevoCliente" autocomplete="name">
                    <p class="error" id="errorNombreNuevoCliente"></p>
                </div>

                <div class="campo">
                    <label for="correoNuevoCliente">Correo electrónico</label>
                    <input type="email" id="correoNuevoCliente" autocomplete="email">
                    <p class="error" id="errorCorreoNuevoCliente"></p>
                </div>

                <div class="campo">
                    <label for="claveNuevoCliente">Contraseña</label>
                    <input type="password" id="claveNuevoCliente" autocomplete="new-password">
                    <p class="error" id="errorClaveNuevoCliente"></p>
                </div>

                <button type="submit">Crear cliente</button>
                <p class="mensaje-ok" id="mensajeNuevoCliente"></p>
            </form>
        </section>

        <section>
            <h2>Clientes registrados</h2>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaClientes"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
