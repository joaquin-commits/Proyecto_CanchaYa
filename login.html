<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión - Reserva Canchas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Iniciar sesión</h1>
        <p>Accede según tu tipo de perfil.</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="registro.html">Registrarse</a>
    </nav>

    <main>
        <section>
            <h2>Datos de acceso</h2>
            <form id="formLogin" novalidate>
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" autocomplete="email">
                    <p class="error" id="errorCorreo"></p>
                </div>

                <div class="campo">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" name="clave" autocomplete="current-password">
                    <p class="error" id="errorClave"></p>
                </div>

                <button type="submit">Ingresar</button>
                <p class="error" id="errorLogin"></p>
            </form>
        </section>

        <section>
            <h2>Cuentas de demostración</h2>
            <article>
                <p><strong>Cliente:</strong> cliente1@canchas.cl / 1234</p>
                <p><strong>Dueño 1:</strong> dueno1@canchas.cl / 1234</p>
                <p><strong>Dueño 2:</strong> dueno2@canchas.cl / 1234</p>
                <p><strong>Administrador:</strong> admin@canchas.cl / admin123</p>
            </article>
        </section>
    </main>

    <footer></footer>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
